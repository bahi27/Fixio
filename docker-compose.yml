services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-bahi27}
      POSTGRES_USER: ${DATABASE_USERNAME:-bahi27}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bahi27}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_USERNAME:-bahi27} -d ${DATABASE_NAME:-bahi27}
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
